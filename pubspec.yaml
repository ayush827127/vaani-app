name: vaani
description: "Vaani - AI Store Manager. Voice Billing, Inventory, Invoice, Reports."
publish_to: 'none'
version: 1.0.0+2

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # Database
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.3

  # PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0

  # Voice Recognition
  speech_to_text: ^7.0.0

  # Text-to-Speech (PTT confirmation)
  flutter_tts: ^4.0.2

  # File System & Picker
  file_picker: ^8.0.7
  image_picker: ^1.1.2
  share_plus: ^12.0.2

  # Local Notifications
  flutter_local_notifications: ^17.2.2

  # Charts
  fl_chart: ^0.67.0

  # Storage
  shared_preferences: ^2.3.1

  # DI
  get_it: ^7.6.7

  # Utilities
  uuid: ^4.3.3
  intl: 0.20.2
  logger: ^2.3.0

  # QR Code
  qr_flutter: ^4.1.0

  # 1D Barcode rendering (product labels)
  barcode_widget: ^2.0.4

  # Barcode / QR scanner
  mobile_scanner: ^5.2.3

  # Thermal printer support
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.0.0
  flutter_usb_printer: ^0.3.1

  # AI & Environment
  http: ^1.2.2
  flutter_dotenv: ^5.2.1

  # UPI payment intent launch
  url_launcher: ^6.3.1

  # UI
  lottie: ^3.1.2
  cupertino_icons: ^1.0.8
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true
  generate: true

  assets:
    - .env
    - assets/images/
    - assets/lottie/
    - assets/icon/banner.jpeg

# Run `dart run flutter_launcher_icons` after changing anything here to
# regenerate the actual per-platform icon files.
flutter_launcher_icons:
  android: true
  ios: false # no ios/ platform folder exists in this project (Android-only so far)
  image_path: "assets/icon/icon_square.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/icon_adaptive_fg.png"
